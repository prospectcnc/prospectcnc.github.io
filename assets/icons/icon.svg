<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The crosshair box from the Prospect CNC logo, in the logo's proportions (circle ~76% of the box, long centre dash,
       dots near the circle), with lines bolder than the logo so they survive at tab size -->
  <rect width="64" height="64" rx="8" fill="#ffffff"/>
  <rect x="9.5" y="9.5" width="45" height="45" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#000000" stroke-width="3"/>
  <g fill="#000000">
    <!-- vertical centre line: solid outside, then dot, long dash through the centre, dot -->
    <rect x="30.5" y="3" width="3" height="13.5"/><rect x="30.5" y="47.5" width="3" height="13.5"/>
    <rect x="30.5" y="24" width="3" height="16"/><rect x="30.5" y="19" width="3" height="2.5"/><rect x="30.5" y="42.5" width="3" height="2.5"/>
    <!-- horizontal centre line, same pattern -->
    <rect x="3" y="30.5" width="13.5" height="3"/><rect x="47.5" y="30.5" width="13.5" height="3"/>
    <rect x="24" y="30.5" width="16" height="3"/><rect x="19" y="30.5" width="2.5" height="3"/><rect x="42.5" y="30.5" width="2.5" height="3"/>
  </g>
</svg>
